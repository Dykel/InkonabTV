# HTTPS relay for the website's video (see ../worker.js and README).
# Deployed on its own Cloudflare account (not the one running inkonab-pair), with its own wrangler login:
#   XDG_CONFIG_HOME=~/.wrangler-relay npx wrangler login
name = "inkonab-relay"
main = "../worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
